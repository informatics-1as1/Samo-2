<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="لعبة أسئلة في الإعلام الآلي للمبتدئين: الفريق الأحمر ضد الفريق الأزرق">
<title>تحدي الإعلام الآلي: الأحمر ضد الأزرق</title>
<style>
:root{color-scheme:dark;--r:#ff2a2a;--b:#2a7bff;--y:#ffd21f;--bg:#07080f;--card:#0c0e1c;--tx:#f2f4ff;--mu:#9aa0bd;--ok:#2ee27a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.5;
background:radial-gradient(ellipse 75% 50% at 0% 100%,rgba(255,30,30,.65),transparent 70%),radial-gradient(ellipse 75% 50% at 100% 100%,rgba(30,110,255,.65),transparent 70%),radial-gradient(ellipse 60% 40% at 0% 0%,rgba(255,30,30,.4),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 0%,rgba(30,110,255,.4),transparent 70%),linear-gradient(90deg,rgba(255,30,30,.14),transparent 50%,rgba(30,110,255,.14)),var(--bg);background-attachment:fixed}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 16px 120px}
.crowd{position:fixed;bottom:0;width:46%;max-width:250px;height:auto;pointer-events:none;z-index:0}
.cl{left:0}.cq{right:0}
.head{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.35rem;font-weight:800;padding:8px 0 14px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--r),var(--b)) 1;margin-bottom:34px}
.head b{filter:drop-shadow(0 0 7px rgba(255,210,31,.6));background:linear-gradient(90deg,#fff,var(--y));-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:14px}
.team{position:relative;flex:1;text-align:center;padding:16px 6px 8px;border-radius:20px;background:rgba(12,14,28,.85);border:2px solid;transition:.25s;direction:rtl}
.team .cr{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:1.9rem;font-style:normal}
.team small{display:block;font-weight:700;font-size:.95rem}
.team span{display:block;font-size:2.8rem;font-weight:800;line-height:1.1;text-shadow:0 0 12px currentColor}
.team.red{border-color:var(--r);color:#ff4a4a;box-shadow:0 0 12px rgba(255,42,42,.45);background:linear-gradient(180deg,rgba(255,42,42,.24),rgba(12,14,28,.9))}
.team.blue{border-color:var(--b);color:#4d9bff;box-shadow:0 0 12px rgba(42,123,255,.45);background:linear-gradient(180deg,rgba(42,123,255,.24),rgba(12,14,28,.9))}
.team.on.red{animation:gr .8s infinite alternate;transform:scale(1.06)}
.team.on.blue{animation:gb .8s infinite alternate;transform:scale(1.06)}
@keyframes gr{from{box-shadow:0 0 18px rgba(255,42,42,.8)}to{box-shadow:0 0 28px rgba(255,42,42,.9),0 0 50px rgba(255,42,42,.4)}}
@keyframes gb{from{box-shadow:0 0 18px rgba(42,123,255,.8)}to{box-shadow:0 0 28px rgba(42,123,255,.9),0 0 50px rgba(42,123,255,.4)}}
@keyframes pl{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.25);transform:scale(1.08)}}
.vs{font-size:2rem;font-weight:900;font-style:italic;color:var(--y);text-shadow:0 0 10px #ff9d00,0 0 20px rgba(255,157,0,.7);animation:pl .8s infinite alternate}
.turn{text-align:center;padding:8px 14px;border-radius:30px;border:1px solid rgba(255,210,31,.6);box-shadow:0 0 12px rgba(255,210,31,.28);background:rgba(12,14,28,.8);font-weight:700;color:var(--y);margin:0 auto 8px;max-width:360px}
.count{text-align:center;color:var(--mu);margin-bottom:26px}
.qbox{position:relative;padding:36px 16px 8px;border-radius:26px;border:2px solid transparent;
background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--r),var(--b)) border-box;box-shadow:-10px 0 28px rgba(255,42,42,.38),10px 0 28px rgba(42,123,255,.38)}
.qm{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;background:#0a1030;border:2px solid var(--b);display:grid;place-items:center;font-size:1.6rem;font-weight:800;box-shadow:0 0 16px var(--b),0 0 28px var(--b)}
.q{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;color:var(--tx);font:inherit;font-weight:600;padding:12px 14px;margin-bottom:12px;border-radius:40px;border:2px solid transparent;cursor:pointer;
background:linear-gradient(#0a0c1a,#0a0c1a) padding-box,linear-gradient(90deg,var(--r),var(--b)) border-box;box-shadow:-4px 0 10px rgba(255,42,42,.3),4px 0 10px rgba(42,123,255,.3)}
.opt i{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.25rem;font-weight:800;color:#cfd6ff;background:linear-gradient(135deg,#3a43a0,#1a1f3a);border:1px solid #7a84ff}
.opt:active{transform:scale(.99)}
.opt.ok{background:linear-gradient(#0c2a1a,#0c2a1a) padding-box,linear-gradient(90deg,var(--ok),var(--ok)) border-box;box-shadow:0 0 16px rgba(46,226,122,.6)}
.opt.bad{background:linear-gradient(#2a0c10,#2a0c10) padding-box,linear-gradient(90deg,var(--r),var(--r)) border-box;box-shadow:0 0 16px rgba(255,59,59,.6)}
.msg{text-align:center;font-weight:800;min-height:1.6em;margin:12px 0 8px}
.btn{display:block;width:100%;border:0;border-radius:40px;padding:13px;font:inherit;font-weight:800;color:#1b1400;background:linear-gradient(90deg,var(--y),#ff8a1f);box-shadow:0 0 14px rgba(255,160,30,.55);cursor:pointer;margin-bottom:10px}
.timer{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;color:var(--mu);font-weight:700}
.timer em{font-style:normal;font-size:2rem}
.bar{height:6px;border-radius:6px;margin:8px auto 0;max-width:300px;background:#1a1f3a;overflow:hidden}
.bar div{box-shadow:0 0 10px var(--y);height:100%;width:100%;background:linear-gradient(90deg,var(--y),var(--r));transition:width .25s linear}
.hide{display:none}
.end{text-align:center;padding:30px 16px}
.end h2{font-size:1.7rem;margin:8px 0}
.end .tr{font-size:4rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.me{text-align:center;color:var(--mu);font-weight:700;margin:0 0 12px}
.pk{display:block;width:100%;padding:18px;border-radius:24px;border:2px solid;font:inherit;font-weight:800;font-size:1.3rem;margin-bottom:14px;color:#fff;cursor:pointer}
.pk.red{border-color:var(--r);background:linear-gradient(180deg,rgba(255,42,42,.35),rgba(12,14,28,.9));box-shadow:0 0 14px rgba(255,42,42,.5)}
.pk.blue{border-color:var(--b);background:linear-gradient(180deg,rgba(42,123,255,.35),rgba(12,14,28,.9));box-shadow:0 0 14px rgba(42,123,255,.5)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:#1a1f3a;color:var(--tx);box-shadow:none}
.opt.wait{opacity:.6}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="pp" viewBox="0 0 40 60"><circle cx="20" cy="12" r="9"/><path d="M2 60C2 34 10 26 20 26S38 34 38 60Z"/></symbol>
<symbol id="pa" viewBox="0 0 40 60"><circle cx="20" cy="14" r="9"/><path d="M4 60C4 38 10 30 20 30S36 38 36 60Z"/><path d="M8 38L1 12L6 10L14 32ZM32 38L39 12L34 10L26 32Z"/></symbol>
</defs></svg>
<svg class="crowd cl" viewBox="0 0 224 100" fill="#05060c" aria-hidden="true"><line x1="70" y1="4" x2="70" y2="70" stroke="#05060c" stroke-width="3"/><polygon points="70,6 118,14 70,32" fill="#ff3b3b" opacity=".9"/><use href="#pa" x="0" y="16" width="56" height="84"/><use href="#pp" x="34" y="34" width="44" height="66"/><use href="#pa" x="66" y="14" width="58" height="86"/><use href="#pp" x="104" y="34" width="44" height="66"/><use href="#pa" x="138" y="16" width="56" height="84"/><use href="#pp" x="176" y="32" width="46" height="68"/></svg>
<svg class="crowd cq" viewBox="0 0 224 100" fill="#05060c" aria-hidden="true" style="transform:scaleX(-1)"><line x1="70" y1="4" x2="70" y2="70" stroke="#05060c" stroke-width="3"/><polygon points="70,6 118,14 70,32" fill="#2f7bff" opacity=".9"/><use href="#pa" x="0" y="16" width="56" height="84"/><use href="#pp" x="34" y="34" width="44" height="66"/><use href="#pa" x="66" y="14" width="58" height="86"/><use href="#pp" x="104" y="34" width="44" height="66"/><use href="#pa" x="138" y="16" width="56" height="84"/><use href="#pp" x="176" y="32" width="46" height="68"/></svg>
<div class="wrap">
<div class="head"><span>🏆</span><b>تحدي الإعلام الآلي</b><span>🎯</span></div>
<div class="scores hide" id="scores">
<div class="team red" id="tr"><i class="cr">👑</i><small>الفريق الأحمر</small><span id="sr">0</span></div>
<div class="vs">VS</div>
<div class="team blue" id="tb"><i class="cr">👑</i><small>الفريق الأزرق</small><span id="sb">0</span></div>
</div>
<div class="me hide" id="me"></div>
<div id="pick"><div class="qbox"><div class="qm">👥</div><div class="q">اختر فريق هذا الجهاز</div>
<button class="pk red" onclick="join('red')">🔴 الفريق الأحمر</button>
<button class="pk blue" onclick="join('blue')">🔵 الفريق الأزرق</button></div></div>
<div id="lobby" class="hide"><div class="qbox"><div class="qm">⏳</div><div class="q">في انتظار الفرق</div>
<p class="count" id="lcount"></p><div class="msg" id="lmsg"></div>
<button class="btn" id="go">ابدأ التحدي</button>
<button class="btn alt" id="leave">تغيير الفريق</button></div></div>
<div id="game" class="hide">
<div class="turn" id="turn"></div>
<div class="count" id="count"></div>
<div class="qbox">
<div class="qm">?</div>
<div class="q" id="q"></div>
<div id="opts"></div>
</div>
<div class="msg" id="msg"></div>
<button class="btn hide" id="next">السؤال التالي</button>
<div class="timer"><span>⏳</span><span>أجب بسرعة...</span><em id="tm">20</em></div>
<div class="bar"><div id="bar"></div></div>
</div>
<div class="qbox end hide" id="end">
<div class="tr">🏆</div>
<h2 id="winner"></h2>
<p id="final"></p>
<button class="btn" id="again">العب من جديد</button>
</div>
</div>
<script>
var IC={"المعالج (CPU)": "🔲", "الشاشة": "🖥️", "الفأرة": "🖱️", "الطابعة": "🖨️", "لوحة المفاتيح": "⌨️", "السماعات": "🔊", "الماسح الضوئي": "📠", "الميكروفون": "🎤", "Windows": "🪟", "Word": "📝", "Chrome": "🌐", "Excel": "📊", "Ctrl + C": "📋", "Ctrl + V": "📥", "Ctrl + X": "✂️", "Ctrl + Z": "↩️", "Paint": "🎨", "Calculator": "🧮", "Notepad": "🗒️", "غيغابايت": "💾", "ميغابايت": "💽", "كيلوبايت": "📄", "بايت": "🔹", "8": "8️⃣", "2": "2️⃣", "4": "4️⃣", "16": "🔢", "الذاكرة العشوائية RAM": "⚡", "القرص الصلب": "💽", "فلاش USB": "🔌", "القرص المضغوط": "💿", "Google Chrome": "🌐", "Photoshop": "🖼️", "PowerPoint": "📽️", "برنامج ضار يضر بالجهاز والملفات": "🦠", "جهاز لتبريد الحاسوب": "❄️", "برنامج لتسريع الإنترنت": "🚀", "نوع من الطابعات": "🖨️", "النظام الثنائي (0 و 1)": "💻", "النظام العشري فقط": "🔟", "النظام الروماني": "🏛️", "النظام الستيني": "⏱️", ".jpg": "🖼️", ".mp3": "🎵", ".docx": "📄", ".exe": "⚙️"};
var L=["أ","ب","ج","د"],names={red:"الفريق الأحمر",blue:"الفريق الأزرق"},dots={red:"🔴",blue:"🔵"};
var $=function(i){return document.getElementById(i)};
var S=null,id=localStorage.getItem("lanid"),es=null,left0=0,t0=0;
function show(i,on){$(i).classList.toggle("hide",!on)}
function post(p,b){b=b||{};b.id=id;return fetch(p,{method:"POST",body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){j.ok=r.ok;return j})}).catch(function(){return{ok:false,error:"تعذّر الاتصال بالسيرفر"}})}
function join(team){post("/api/join",{team:team}).then(function(r){if(r.ok){id=r.id;localStorage.setItem("lanid",id);connect()}})}
function connect(){
 if(es)es.close();
 es=new EventSource("/events?id="+encodeURIComponent(id));
 es.onmessage=function(e){S=JSON.parse(e.data);t0=Date.now();left0=S.left||0;render()};
 es.onerror=function(){if(es.readyState===2){es.close();id=null;S=null;localStorage.removeItem("lanid");render()}};
}
function render(){
 var inG=!!(S&&S.team),ph=inG&&S.phase,playing=ph==="question"||ph==="reveal";
 show("pick",!inG);show("scores",inG);show("me",inG);show("lobby",ph==="lobby");show("game",playing);show("end",ph==="final");
 if(!inG)return;
 $("sr").textContent=S.score.red;$("sb").textContent=S.score.blue;
 $("me").textContent="هذا الجهاز: "+dots[S.team]+" "+names[S.team];
 $("tr").classList.toggle("on",playing&&S.turn==="red");$("tb").classList.toggle("on",playing&&S.turn==="blue");
 if(ph==="lobby"){
  $("lcount").textContent="الأجهزة المتصلة — الأحمر: "+S.n.red+" | الأزرق: "+S.n.blue;
  var ready=S.n.red>0&&S.n.blue>0;$("go").disabled=!ready;
  $("lmsg").textContent=ready?"":"ننتظر انضمام جهاز واحد على الأقل لكل فريق";
 }
 if(playing)game();
 if(ph==="final"){
  var r=S.score.red,b=S.score.blue;
  $("winner").textContent=r===b?"تعادل! 🤝":"الفائز: "+(r>b?names.red+" 🔴":names.blue+" 🔵");
  $("final").textContent="الأحمر "+r+" — الأزرق "+b;
 }
}
function game(){
 var t=S.turn,mine=S.team===t,q=S.phase==="question",m=$("msg");
 $("turn").textContent=dots[t]+" الدور على "+names[t]+" "+dots[t];
 $("count").textContent="⏱️ السؤال "+(S.idx+1)+" من "+S.total;
 $("q").textContent=S.q;
 var box=$("opts");box.innerHTML="";
 S.opts.forEach(function(o,i){
  var b=document.createElement("button");b.className="opt";
  b.innerHTML="<i>"+(IC[o]||L[i])+"</i><span></span>";b.lastChild.textContent=o;
  if(!q){if(i===S.res.correct)b.classList.add("ok");else if(i===S.res.pick)b.classList.add("bad")}
  else if(!mine)b.classList.add("wait");
  b.onclick=function(){if(q&&mine)post("/api/answer",{pick:i})};
  box.appendChild(b);
 });
 if(q){m.textContent=mine?"دوركم! اختاروا الإجابة":"انتظروا… "+names[t]+" يجيب الآن";m.style.color=mine?"var(--y)":""}
 else{
  var k=S.res.kind;
  m.textContent=k==="ok"?"✅ إجابة صحيحة! نقطة لـ"+names[t]:k==="bad"?"❌ إجابة خاطئة، لا توجد نقطة":"⏰ انتهى الوقت!";
  m.style.color=k==="ok"?"var(--ok)":k==="bad"?"var(--r)":"var(--y)";
  if(k==="timeout"){$("tm").textContent=0;$("bar").style.width="0%"}
 }
 show("next",!q);
 $("next").textContent=S.idx+1<S.total?"السؤال التالي":"عرض النتيجة";
}
function tick(){
 if(S&&S.phase==="question"){var r=Math.max(0,left0-(Date.now()-t0));$("tm").textContent=Math.ceil(r/1000);$("bar").style.width=(r/(S.secs*1000)*100)+"%"}
 requestAnimationFrame(tick);
}
$("go").onclick=function(){post("/api/start").then(function(r){if(!r.ok)$("lmsg").textContent=r.error||""})};
$("leave").onclick=function(){post("/api/leave").then(function(){if(es)es.close();id=null;S=null;localStorage.removeItem("lanid");render()})};
$("next").onclick=function(){post("/api/next",{idx:S.idx})};
$("again").onclick=function(){post("/api/again")};
tick();
if(id){show("pick",false);connect()}
</script>
</body>
</html>
